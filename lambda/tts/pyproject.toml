[project]
name = "tts"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
# boto3 is provided by the AWS Lambda Python runtime, so it is deliberately not
# a project dependency: shipping it adds ~25 MB of boto3/botocore to the
# artifact for no benefit. It stays here so local runs and tests still resolve
# it, since `uv export --no-dev` (which the packager uses) leaves it out.
dev = [
    "boto3>=1.42.28",
]
