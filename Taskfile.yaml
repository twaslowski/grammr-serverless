version: "3"
tasks:
  start-env:
    desc: Start supabase
    cmds:
      - pnpm supabase start --exclude storage-api,mailpit,edge-runtime,vector

  stop-env:
    desc: Start supabase
    cmds:
      - pnpm supabase stop

  e2e:
    desc: Run end-to-end tests
    cmds:
      - pnpm db:migrate
      - pnpm e2e

  run:
    desc: Run the development server
    cmds:
      - task: start-env
      - pnpm run dev

  apply:*:
    desc: Apply dev infrastructure changes
    dir: ./terraform/application
    vars:
      ENVIRONMENT: "{{index .MATCH 0}}"
    cmds:
      - tofu init -backend-config=config/{{.ENVIRONMENT}}.hcl -reconfigure
      - tofu apply -var-file=config/{{.ENVIRONMENT}}.tfvars -var-file=config/secrets.tfvars

  build:
    desc: Run formatter, linter, and tests
    cmds:
      - pnpm run fmt
      - pnpm run lint:fix
      - pnpm run lint
      - pnpm run test
      - pnpm run build
